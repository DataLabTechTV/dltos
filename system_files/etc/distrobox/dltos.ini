[dltos]
image=fedora-toolbox:latest
pull=true
entry=false
nvidia=true
pre_init_hooks=export SHELL=/bin/zsh
pre_init_hooks=dnf5 -y copr enable atim/starship
additional_packages=starship fastfetch zoxide bat ripgrep fd-find eza ncdu age btop nvtop lshw lspci
additional_packages=just neovim
additional_packages=jq yq sqlite3
init_hooks=alternatives --install /usr/bin/vim vim /usr/bin/nvim 100
volume="/etc/zshrc:/etc/zshrc:ro"
volume="/etc/zprofile:/etc/zprofile:ro"
volume="/etc/zshrc.d:/etc/zshrc.d:ro"
volume="/usr/share/zsh/antidote:/usr/share/zsh/antidote:ro"
volume="/usr/share/zsh/site-functions/man:/usr/share/zsh/site-functions/man:ro"
volume="/usr/share/zsh/site-functions/ls:/usr/share/zsh/site-functions/ls:ro"
volume="/etc/starship.toml:/etc/starship.toml:ro"
